        <!-- Main Content -->
        <main>
            <!-- SVG -->
            <section id="svg">
                <h2>SVG</h2>
                <svg width="100%" height="100%" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <rect width="200" height="100" style="fill:blue;"/> <!-- 矩形 -->
                </svg>
                <svg width="100%" height="100%" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="50" r="40" style="fill:green"/> <!-- 圓形 -->
                </svg>
                <svg width="100%" height="100%" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="200" cy="50" rx="100" ry="50" style="fill:purple"/> <!-- 橢圓形 -->
                </svg>        
            </section>

            <hr>

            <!-- Canvas -->
            <section id="canvas">
                <h2>Canvas</h2>
                <canvas id="myCanvas" width="600" height="400"></canvas>
                <script>
                    const canvas = document.getElementById('myCanvas');
                    const ctx = canvas.getContext('2d');
    
                    // 矩形
                    ctx.fillStyle = 'blue';
                    ctx.fillRect(50, 50, 200, 100);
    
                    // 圓形
                    ctx.beginPath();
                    ctx.arc(350, 150, 50, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff6600';
                    ctx.fill();
                    ctx.closePath();
    
                    // 文字
                    ctx.fillStyle = '#333';
                    ctx.font = '20px Arial';
                    ctx.fillText('Giant You', 200, 300);

                    // 線性梯度
                    const grad=ctx.createLinearGradient(0,0, 280,0);
                    grad.addColorStop(0, "lightblue");
                    grad.addColorStop(1, "darkblue");
                    ctx.fillStyle = grad;
                    ctx.fillRect(50,200, 280,130);
                </script>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Giant's Webpage</p>
        </footer>
        
        <script src="HW2.js"></script>
    </body>
